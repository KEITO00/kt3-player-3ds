[package]
name = "kt3-player-3ds"
version = "1.0.0"
edition = "2024"
authors = ["keitodaze"]
description = "Plays .kt3 files"
license = "MIT"
repository = "https://github.com/KEITO00/kt3-player-3ds"
publish = false

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs" }
ktc = { git = "https://github.com/KEITO00/ktc" }
bytemuck = "1"
serde_json = "1"
image-webp = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[patch."https://github.com/rust3ds/ctru-rs"]
ctru-rs = { path = "vendor/ctru-rs/ctru-rs" }
ctru-sys = { path = "vendor/ctru-rs/ctru-sys" }
